    <!-- Actual portfolio is constructed here -->
    <main id="website">

        <div id="construction-message">

            A small creative crew is at work.
        </div>

        <div id="site-root"></div>

    </main>

    <footer id="site-footer"></footer>

    <script>
    /* =====================================================
       THE DIGITAL ME — SWARM CONSTRUCTION ENGINE
       ===================================================== */

    const siteRoot = document.getElementById("site-root");
    const workerLayer = document.getElementById("worker-layer");

    const workerStatus = {
        architect: document.getElementById("architect-status"),
        writer: document.getElementById("writer-status"),
        artist: document.getElementById("artist-status"),
        finisher: document.getElementById("finisher-status")
    };

    let paused = false;
    let skipped = false;
    let running = false;
    let constructionId = 0;

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function waitForResume(id) {
        while (paused && !skipped && id === constructionId) {
            await sleep(100);
        }

        if (id !== constructionId) {
            throw new Error("Construction restarted");
        }
    }

    async function delay(ms, id) {
        await waitForResume(id);

        if (skipped) return;

        await sleep(ms);
        await waitForResume(id);
    }

    function setStatus(worker, text) {
        if (workerStatus[worker]) {
            workerStatus[worker].textContent = text;
        }
    }

    function createWorker(name, icon, color, role) {
        const worker = document.createElement("div");

        worker.className = "worker-cursor";
        worker.style.setProperty("--worker-color", color);

        worker.innerHTML = `
            <div class="worker-character" aria-hidden="true">
                <span class="bot-eyes"><i></i><i></i></span>
                <span class="bot-smile"></span>
            </div>
            <div class="worker-label">
                <strong>${name}</strong>
                <small>${role}</small>
            </div>
            <div class="worker-trail"></div>
        `;

        workerLayer.appendChild(worker);

        return worker;
    }

    const workers = {
        architect: createWorker("Architect", "☺", randomBotColor(), "LAYOUT"),
        writer: createWorker("Writer", "☺", randomBotColor(), "CONTENT"),
        artist: createWorker("Artist", "☺", randomBotColor(), "VISUALS"),
        finisher: createWorker("Finisher", "☺", randomBotColor(), "DETAILS")
    };

    function randomBotColor() {
        const colors = ["#6C73D8", "#D77B51", "#4A9D83", "#B28A48", "#C16F9D", "#438DA8", "#8A78C5"];
        return colors[Math.floor(Math.random() * colors.length)];
    }

    function showBotMessage(message, anchor) {
        const bubble = document.getElementById("bot-message");
        bubble.textContent = message;
        bubble.classList.add("visible");
        if (anchor) {
            const rect = anchor.getBoundingClientRect();
            bubble.style.left = `${Math.min(window.innerWidth - 230, Math.max(12, rect.left + rect.width / 2 - 100))}px`;
            bubble.style.top = `${Math.max(12, rect.top - 55)}px`;
        }
        clearTimeout(showBotMessage.timer);
        showBotMessage.timer = setTimeout(() => bubble.classList.remove("visible"), 2000);
    }

    async function moveWorker(worker, target, offsetX = 0, offsetY = 0) {
        if (!target) return Promise.resolve();

        let rect = target.getBoundingClientRect();

        if (rect.top < 90 || rect.bottom > window.innerHeight - 80) {
            target.scrollIntoView({ behavior: "smooth", block: "center" });
            await sleep(420);
            rect = target.getBoundingClientRect();
        }

        const x = rect.left + rect.width / 2 + offsetX;
        const y = rect.top + rect.height / 2 + offsetY;

        worker.style.transform = `translate(${x}px, ${y}px)`;
        worker.classList.add("worker-active");

        return sleep(350);
    }

    function hideWorker(worker) {
        worker.classList.remove("worker-active");
    }

    function createSection(id, className = "") {
        const section = document.createElement("section");

        section.id = id;
        section.className = `portfolio-section ${className}`;

        section.innerHTML = `
            <div class="section-inner">
                <div class="section-content"></div>
            </div>
        `;

        siteRoot.appendChild(section);
        requestAnimationFrame(() => section.scrollIntoView({ behavior: "smooth", block: "start" }));

        return section;
    }

    function createElement(tag, className, text = "") {
        const element = document.createElement(tag);

        if (className) element.className = className;
        if (text) element.textContent = text;

        return element;
    }

    async function typeText(element, text, id, speed = 18) {
        if (!element) return;
        const value = String(text ?? "");
        element.textContent = "";
        const fragment = document.createDocumentFragment();
        const letters = [];

        for (const character of value) {
            const tile = document.createElement("span");
            tile.className = character === " " ? "print-space" : "print-letter";
            tile.textContent = character;
            fragment.appendChild(tile);
            letters.push(tile);
        }
        element.appendChild(fragment);

        const sectionWriters = Array.from({ length: 4 }, (_, index) =>
            createWorker(`Writer ${index + 1}`, "☺", randomBotColor(), "LETTER TILES")
        );

        for (let index = 0; index < letters.length; index++) {
            await waitForResume(id);
            if (skipped) {
                element.textContent = value;
                return;
            }
            const tile = letters[index];
            tile.classList.add("letter-built");
            if (index % 4 === 0) {
                const rect = tile.getBoundingClientRect();
                const bot = sectionWriters[(index / 4) % sectionWriters.length];
                bot.style.transform =
                    `translate(${rect.left + rect.width / 2}px, ${rect.top + rect.height / 2}px)`;
                bot.classList.add("worker-active");
            }
            await sleep(characterDelay(tile.textContent, speed));
        }
        sectionWriters.forEach(bot => {
            hideWorker(bot);
            bot.remove();
        });
    }

    function characterDelay(character, speed) {
        return character === " " ? Math.max(3, speed * 0.25) : Math.max(3, speed * 0.35);
    }

    async function printImageWithSwarm(frame, id) {
        if (!frame) return;
        const photo = frame.querySelector("img");
        const placeholder = frame.querySelector(".photo-placeholder");
        if (!photo || !placeholder) return;

        const mosaic = document.createElement("div");
        mosaic.className = "image-print-grid";
        placeholder.appendChild(mosaic);

        const tiles = [];
        const columns = 5;
        const rows = 2;
        for (let row = 0; row < rows; row++) {
            for (let column = 0; column < columns; column++) {
                const tile = document.createElement("span");
                tile.className = "image-print-tile";
                tile.style.setProperty("--tile-x", `${column * 100 / (columns - 1)}%`);
                tile.style.setProperty("--tile-y", `${row * 100 / (rows - 1)}%`);
                tile.style.setProperty("--tile-col", column);
                tile.style.setProperty("--tile-row", row);
                if (photo.getAttribute("src")) {
                    tile.style.backgroundImage = `url("${photo.getAttribute("src")}")`;
                    tile.style.backgroundSize = `${columns * 100}% ${rows * 100}%`;
                    tile.style.backgroundPosition = `${column * 100 / (columns - 1)}% ${row * 100}%`;
                }
                mosaic.appendChild(tile);
                tiles.push(tile);
            }
        }

        const imageBots = Array.from({ length: 10 }, (_, index) =>
            createWorker(`Pixel Bot ${index + 1}`, "☺", randomBotColor(), "IMAGE TILE")
        );
        const shuffled = tiles.map((_, index) => index).sort(() => Math.random() - 0.5);

        for (let botIndex = 0; botIndex < shuffled.length; botIndex++) {
            await waitForResume(id);
            if (skipped) break;
            const tileIndex = shuffled[botIndex];
            const tile = tiles[tileIndex];
            const bot = imageBots[botIndex];
            const rect = tile.getBoundingClientRect();
            bot.style.transform = `translate(${rect.left + rect.width / 2}px, ${rect.top + rect.height / 2}px)`;
            bot.classList.add("worker-active");
            tile.classList.add("printed");
            await sleep(85);
        }

        imageBots.forEach(bot => {
            hideWorker(bot);
            bot.remove();
        });
        mosaic.remove();
        if (photo.complete && photo.naturalWidth > 0) photo.classList.add("photo-printed");
        else placeholder.classList.add("photo-printed");
        showBotMessage("How are you? 😊", frame);
    }

    async function drawElement(element, id) {
        if (!element) return;

        element.classList.add("drawing");

        await delay(450, id);

        element.classList.add("drawn");
        element.classList.remove("drawing");
    }

            <div class="header-inner">

        `;

        siteRoot.appendChild(nav);

        await moveWorker(workers.architect, nav);

        nav.classList.add("constructed");

        const brand = nav.querySelector(".brand-name");

        await moveWorker(workers.writer, brand);

        await typeText(brand, data.site.brand, id, 30);

        await moveWorker(workers.finisher, nav);

        nav.classList.add("polished");

        return nav;
    }

        await moveWorker(workers.architect, section);

        section.classList.add("constructed");

        const lead = content.querySelector(".about-lead");

        const facts = content.querySelector(".about-facts");

    async function constructContact(data, id) {
        const section = createSection("contact", "contact-section");
        const content = section.querySelector(".section-content");

        content.innerHTML = `
            <div class="contact-card">
                <span class="section-number">05 — SAY HELLO</span>

                <h2>Something good<br>starts with <em>hello.</em></h2>

                <p class="contact-copy"></p>

                    Get in touch ↗
                </a>

                <div class="contact-socials"></div>
                <div class="contact-email"></div>
            </div>
        `;

        await moveWorker(workers.architect, section);

        section.classList.add("constructed");

        const copy = content.querySelector(".contact-copy");

        await moveWorker(workers.writer, copy);
        await typeText(copy, data.contact.copy, id, 14);

        const email = content.querySelector(".contact-email");
        const button = content.querySelector(".contact-button");

        const validEmail = data.profile.email &&
            data.profile.email !== "hello@example.com";

        if (validEmail) {
            button.href = "mailto:" + data.profile.email;
            email.textContent = data.profile.email;
        } else {
            button.href = "#";
            button.addEventListener("click", event => {
                event.preventDefault();
                alert("Add your real email address in content.json.");
            });

            email.textContent = "Add your email in content.json";
        }

        const socials = content.querySelector(".contact-socials");

socials.innerHTML = (data.socials || []).map(social => `
    <a href="${safeURL(social.url)}"
       target="_blank"
       rel="noopener noreferrer">
        ${escapeHTML(social.label)} ↗
    </a>
`).join("");

        await moveWorker(workers.artist, content.querySelector(".contact-card"));

        await drawElement(
            content.querySelector(".contact-card"),
            id
        );

        await moveWorker(workers.finisher, section);

        section.classList.add("polished");

        return section;
    }

    function constructFooter(data) {
        const footer = document.getElementById("site-footer");

        footer.innerHTML = `
            <div class="footer-inner">
                <span>© ${new Date().getFullYear()} ${escapeHTML(data.profile.name)}</span>
                <span>Made with curiosity and a little help from a tiny crew.</span>
                <a href="#home">Back to top ↑</a>
            </div>
        `;
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    function safeURL(value) {
        try {
            const url = new URL(value, window.location.href);

            if (["http:", "https:", "mailto:"].includes(url.protocol) ||
                value.startsWith("#")) {
                return escapeHTML(value);
            }
        } catch (_) {}

        return "#contact";
    }

    async function architectTask(data, id) {
        setStatus("architect", "Building the layout");

        await createNavigation(data, id);
        await constructHero(data, id);
        await constructAbout(data, id);
        await constructEducation(data, id);
        await constructSkills(data, id);
        await constructProjects(data, id);
        await constructJourney(data, id);
        await constructContact(data, id);

        setStatus("architect", "Structure complete");
    }

    async function writerTask(data, id) {
        setStatus("writer", "Preparing the content");

        // The writer joins the architect's work as soon as
        // the relevant DOM elements become available.
        while (!skipped && id === constructionId &&
               !document.querySelector(".hero-title")) {
            await sleep(100);
        }

        if (id !== constructionId) return;

        setStatus("writer", "Writing the portfolio");

        // Actual typing is coordinated by each section builder.
        // The separate worker remains visible during construction.
        await waitForResume(id);

        setStatus("writer", "Content complete");
    }

    async function artistTask(data, id) {
        setStatus("artist", "Preparing visual elements");

        while (!skipped && id === constructionId &&
               !document.querySelector(".hero-visual")) {
            await sleep(100);
        }

        if (id !== constructionId) return;

        setStatus("artist", "Creating the visuals");

        await waitForResume(id);

        setStatus("artist", "Visuals complete");
    }

    async function finisherTask(data, id) {
        setStatus("finisher", "Preparing finishing touches");

        while (!skipped && id === constructionId &&
               !document.querySelector(".site-header")) {
            await sleep(100);
        }

        if (id !== constructionId) return;

        setStatus("finisher", "Polishing the details");

        await waitForResume(id);

        setStatus("finisher", "Ready");
    }

    async function runConstruction() {
        if (running) return;

        running = true;
        paused = false;
        skipped = false;

        const id = ++constructionId;

        document.getElementById("construction-message").style.display = "flex";

        document.getElementById("site-footer").innerHTML = "";

        siteRoot.innerHTML = "";

        Object.values(workers).forEach(worker => {
            worker.classList.add("worker-active");
        });

        try {
            const response = await fetch("content.json");

            if (!response.ok) {
                throw new Error("Could not load content.json");
            }

            const data = await response.json();

            /*
             * All four crew members have independent tasks.
             * The architect coordinates DOM construction.
             * Writer, artist and finisher perform their actions
             * during construction rather than after a fake loader.
             */

            const crew = [
                writerTask(data, id),
                artistTask(data, id),
                finisherTask(data, id)
            ];

            await architectTask(data, id);

            await Promise.all(crew);

            if (skipped || id !== constructionId) return;

            constructFooter(data);

            document.getElementById("construction-message").innerHTML =
                `<span class="message-dot finished"></span>
                 Your digital space is ready.`;

            Object.values(workers).forEach(hideWorker);

            setStatus("architect", "Done ✓");
            setStatus("writer", "Done ✓");
            setStatus("artist", "Done ✓");
            setStatus("finisher", "Done ✓");

            siteRoot.classList.add("site-ready");

        } catch (error) {
            if (error.message !== "Construction restarted") {
                console.error(error);

                document.getElementById("construction-message").textContent =
                    "Something went wrong. Run the website using a local server.";
            }
        } finally {
            if (id === constructionId) {
                running = false;
            }
        }
    }

    function skipConstruction() {
        skipped = true;
        paused = false;

        // A replay is used to build the complete site without
        // the character-by-character construction.
        constructionId++;
        running = false;

        fetch("content.json")
            .then(response => response.json())
            .then(data => buildInstantly(data))
            .catch(error => console.error(error));
    }

    async function buildInstantly(data) {
        siteRoot.innerHTML = "";
        document.getElementById("site-footer").innerHTML = "";

        const id = ++constructionId;

        // Build all sections using the same real DOM constructors.
        await createNavigationInstant(data);
        await heroInstant(data);
        await aboutInstant(data);
        await educationInstant(data);
        await skillsInstant(data);
        await projectsInstant(data);
        await journeyInstant(data);
        await contactInstant(data);

        constructFooter(data);

        document.getElementById("construction-message").innerHTML =
            `<span class="message-dot finished"></span>
             Your digital space is ready.`;

        Object.values(workers).forEach(hideWorker);

        setStatus("architect", "Done ✓");
        setStatus("writer", "Done ✓");
        setStatus("artist", "Done ✓");
        setStatus("finisher", "Done ✓");

        running = false;
        paused = false;
    }

    async function contactInstant(data) {
        const section = createSection("contact", "contact-section constructed polished");
        const content = section.querySelector(".section-content");

        const validEmail = data.profile.email &&
            data.profile.email !== "hello@example.com";

        content.innerHTML = `
            <div class="contact-card drawn">
                <span class="section-number">05 — SAY HELLO</span>

                <h2>Something good<br>starts with <em>hello.</em></h2>

                <a class="contact-button" href="${validEmail ? "mailto:" + escapeHTML(data.profile.email) : "#"}">
                    Get in touch ↗

                <div class="contact-email">
                    ${validEmail ? escapeHTML(data.profile.email) : "Add your email in content.json"}
                </div>
                <div class="contact-socials">
                    ${(data.socials || []).map(social => `
                        <a href="${safeURL(social.url)}" target="_blank" rel="noopener noreferrer">
                            ${escapeHTML(social.label)} ↗

    /* ================= CONTROLS ================= */

    document.getElementById("pause-btn").addEventListener("click", function () {
        if (!running) return;

        paused = !paused;

        this.textContent = paused ? "▶ Resume" : "Ⅱ Pause";
    });

    document.getElementById("replay-btn").addEventListener("click", () => {
        constructionId++;
        running = false;
        paused = false;
        skipped = false;

        document.getElementById("pause-btn").textContent = "Ⅱ Pause";

        Object.values(workers).forEach(worker => {
            worker.classList.remove("worker-active");
        });

        setTimeout(runConstruction, 150);
    });

    document.getElementById("skip-btn").addEventListener("click", skipConstruction);

    document.getElementById("panel-toggle").addEventListener("click", function () {
        const panel = document.getElementById("crew-panel");

        panel.classList.toggle("collapsed");

        const collapsed = panel.classList.contains("collapsed");
        this.textContent = collapsed ? "+" : "−";
        this.setAttribute("aria-expanded", String(!collapsed));
        this.setAttribute("aria-label", collapsed ? "Expand crew panel" : "Collapse crew panel");
    });

    document.getElementById("theme-toggle").addEventListener("click", () => {
        const night = document.body.dataset.theme !== "dark";
        document.body.dataset.theme = night ? "dark" : "light";
        localStorage.setItem("digital-me-theme", night ? "dark" : "light");
        const button = document.getElementById("theme-toggle");
        button.querySelector(".theme-icon").textContent = night ? "☀" : "☾";
        button.querySelector(".theme-label").textContent = night ? "Day" : "Night";
        button.setAttribute("aria-label", night ? "Switch to light theme" : "Switch to night theme");
    });

    (function restoreTheme() {
        const theme = localStorage.getItem("digital-me-theme") || "light";
        document.body.dataset.theme = theme;
        const button = document.getElementById("theme-toggle");
        if (theme === "dark") {
            button.querySelector(".theme-icon").textContent = "☀";
            button.querySelector(".theme-label").textContent = "Day";
            button.setAttribute("aria-label", "Switch to light theme");
        }
    })();

    /* ================= START ================= */

    runConstruction();

    </script>
